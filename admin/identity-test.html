<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Identity Test — Jiatong Lu</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" type="text/javascript"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2933;
      background: #f6f7f8;
    }
    main {
      width: min(440px, calc(100vw - 40px));
      padding: 28px;
      background: #fff;
      border: 1px solid #d9dee4;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    p {
      line-height: 1.5;
      margin: 0 0 18px;
    }
    [data-netlify-identity-button] {
      display: inline-block;
      padding: 10px 14px;
      cursor: pointer;
      color: #fff;
      background: #26343b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Identity Login Test</h1>
    <p>This page tests the Netlify Identity login widget without loading the CMS.</p>
    <div data-netlify-identity-button>Login with Netlify Identity</div>
  </main>
</body>
</html>
