<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Jiatong Lu</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" type="text/javascript"></script>
  <style>
    #identity-warning {
      display: none;
      max-width: 520px;
      margin: 72px auto;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: #1f2933;
    }
    #identity-warning h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    #identity-warning p {
      margin: 0 0 10px;
    }
  </style>
</head>
<body>
  <div id="identity-warning">
    <h1>Login did not load</h1>
    <p>Please refresh this page, or open it in another browser with content blockers turned off.</p>
    <p>The admin login needs Netlify Identity to load before the CMS can open.</p>
  </div>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init();
    }
  </script>

  <!-- Decap CMS app -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    window.addEventListener("load", function() {
      window.setTimeout(function() {
        if (!window.netlifyIdentity) {
          var warning = document.getElementById("identity-warning");
          if (warning) warning.style.display = "block";
        }
      }, 4000);
    });
  </script>
</body>
</html>
