bio: |
  Jiatong Lu is a visual artist working across photography, video, and archives. Born and raised in Northwest China and currently based in New York, she holds an MFA in Photography, Video, and Related Media from SVA. Her work centers on people living outside dominant narratives. Moving between individual experience and public history, her practice examines how personal and collective trauma, systemic forces, and social inequality shape human life. Jiatong's work has been exhibited internationally, including in New York, Chicago, Tucson, and Richmond in the United States, as well as in London, Berlin, Rome, Brussels, Shanghai, and Beijing. Her awards include the Award of Excellence from the 2025 Alexia Vision Grant, the 2024 JGS Fellowship for Photography from NYFA, the Winner of the 2024 LensCulture Art Photography Award, and the 2019 NYFA Artist Fellowship in Photography.
